<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New order</title>
<!-- design-canvas runtime omitted: open in a browser as static HTML; {{holes}} and sc-for render only in the canvas -->
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#027801}a:hover{color:#015C01}
button,input,select,textarea{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F3F4F1; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #171A16; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <header style="background: #FFFFFF; border-bottom: 1px solid #E1E4DE; display: flex; flex-direction: column; gap: 10px; padding: 8px 16px 12px">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 48px">
      <div style="flex: 1; display: flex; flex-direction: column">
        <h1 style="margin: 0; font-size: 20px; line-height: 26px; font-weight: 800">New order</h1>
        <span style="font-size: 13px; color: #545C52">Kayu Manis Restaurant</span>
      </div>
      <button style="height: 40px; padding: 0 12px; border: 1px solid #C9CEC5; border-radius: 20px; background: #FFFFFF; font-size: 14px; font-weight: 600; color: #171A16; display: flex; align-items: center; gap: 6px">Outlet<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
    </div>
    <label style="display: flex; align-items: center; gap: 10px; height: 48px; box-sizing: border-box; background: #F3F4F1; border-radius: 10px; padding: 0 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input aria-label="Search menu" placeholder="Search all menu" style="flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; min-width: 0">
    </label>
    <div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.pick}}" style="flex: 0 0 auto; height: 40px; padding: 0 14px; border-radius: 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; {{c.style}}">{{c.name}}<sc-if value="{{c.hasCount}}" hint-placeholder-val="{{false}}"><span style="min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; {{c.badgeStyle}}">{{c.count}}</span></sc-if></button>
      </sc-for>
    </div>
  </header>

  <main style="flex: 1; overflow-y: auto; padding: 4px 16px 96px; display: flex; flex-direction: column">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="8">
      <button onClick="{{p.add}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 0 -12px; min-height: 72px; border: 0; border-radius: 10px; text-align: left; {{p.rowStyle}}">
        <span style="width: 52px; height: 52px; flex: 0 0 auto; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #6B7368; {{p.thumbStyle}}">{{p.initials}}</span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
          <span style="font-size: 16px; line-height: 22px; font-weight: 600; color: #171A16">{{p.name}}</span>
          <span style="font-size: 16px; font-weight: 700; color: #171A16; font-variant-numeric: tabular-nums">{{p.price}}</span>
        </span>
        <sc-if value="{{p.inCart}}" hint-placeholder-val="{{false}}">
          <span aria-label="in order" style="width: 36px; height: 36px; border-radius: 18px; background: #027801; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{p.qty}}</span>
        </sc-if>
        <sc-if value="{{p.notInCart}}" hint-placeholder-val="{{true}}">
          <span style="height: 40px; padding: 0 14px; border: 1px solid #027801; border-radius: 10px; color: #027801; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#027801" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add</span>
        </sc-if>
      </button>
    </sc-for>
  </main>

  <sc-if value="{{hasCart}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; left: 12px; right: 12px; bottom: 76px">
      <button onClick="{{openCart}}" style="width: 100%; height: 60px; border: 0; border-radius: 14px; background: #027801; color: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 8px 24px rgba(2, 120, 1, 0.28)">
        <span style="min-width: 32px; height: 32px; padding: 0 8px; box-sizing: border-box; border-radius: 8px; background: rgba(255, 255, 255, 0.18); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">{{itemCount}}</span>
        <span style="flex: 1; text-align: left; font-size: 16px; font-weight: 700">Review order</span>
        <span style="font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums">{{total}}</span>
      </button>
    </div>
  </sc-if>

  <nav style="height: 64px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E1E4DE">
    <a href="Phone-Home.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #545C52; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg></span>Home</a>
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #027801; font-size: 12px; font-weight: 700"><span style="width: 56px; height: 28px; border-radius: 14px; background: #E3F1E0; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#027801" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"></path><path d="M19 16v6M16 19h6"></path></svg></span>New order</a>
    <a href="Phone-COList.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #545C52; font-size: 12px; font-weight: 600"><span style="width: 56px; height: 28px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg></span>Captain orders</a>
  </nav>

  <sc-if value="{{sheetCart}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(23, 26, 22, 0.42); display: flex; flex-direction: column; justify-content: flex-end">
      <button aria-label="Close" onClick="{{closeSheet}}" style="flex: 1; border: 0; background: transparent"></button>
      <section style="background: #FFFFFF; border-radius: 16px 16px 0 0; max-height: 640px; display: flex; flex-direction: column; box-shadow: 0 -8px 24px rgba(23, 26, 22, 0.12)">
        <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 36px; height: 4px; border-radius: 2px; background: #C9CEC5"></span></div>
        <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 20px">
          <h2 style="flex: 1; margin: 0; font-size: 18px; font-weight: 800">Order · {{itemCount}} items</h2>
          <button onClick="{{clearCart}}" style="height: 48px; padding: 0 12px; border: 0; background: transparent; color: #B3261E; font-size: 15px; font-weight: 700">Clear</button>
        </div>
        <div style="overflow-y: auto; padding: 0 20px; display: flex; flex-direction: column">
          <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-top: 1px solid #E1E4DE">
              <div style="display: flex; justify-content: space-between; gap: 12px">
                <span style="font-size: 16px; font-weight: 600">{{l.name}}</span>
                <span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{l.amount}}</span>
              </div>
              <div style="display: flex; align-items: center; gap: 8px">
                <div style="display: flex; align-items: center; border: 1px solid #C9CEC5; border-radius: 10px; height: 44px">
                  <button aria-label="Decrease" onClick="{{l.dec}}" style="width: 44px; height: 42px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
                  <span style="min-width: 28px; text-align: center; font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums">{{l.qty}}</span>
                  <button aria-label="Increase" onClick="{{l.inc}}" style="width: 44px; height: 42px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#027801" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
                </div>
                <button style="flex: 1; height: 44px; border: 1px dashed #C9CEC5; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; color: #545C52; text-align: left; overflow: hidden"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16Z"></path></svg><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{l.note}}</span></button>
              </div>
            </div>
          </sc-for>
        </div>
        <div style="padding: 12px 20px 20px; border-top: 1px solid #E1E4DE; display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; color: #545C52">Total before tax &amp; service</span><span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">{{total}}</span></div>
          <button onClick="{{openForm}}" style="height: 52px; border: 0; border-radius: 10px; background: #027801; color: #FFFFFF; font-size: 17px; font-weight: 700">Continue to order details</button>
        </div>
      </section>
    </div>
  </sc-if>

  <sc-if value="{{sheetForm}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; background: rgba(23, 26, 22, 0.42); display: flex; flex-direction: column; justify-content: flex-end">
      <section style="background: #FFFFFF; border-radius: 16px 16px 0 0; height: 800px; display: flex; flex-direction: column">
        <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; border-bottom: 1px solid #E1E4DE">
          <button aria-label="Back to order" onClick="{{openCart}}" style="width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18 9 12l6-6"></path></svg></button>
          <h2 style="flex: 1; margin: 0; font-size: 18px; font-weight: 800">Create captain order</h2>
        </div>
        <form style="flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Table
              <select style="height: 48px; border: 1px solid #C9CEC5; border-radius: 10px; padding: 0 10px; font-size: 16px; color: #171A16; background: #FFFFFF"><option>12</option><option>14</option><option>T-03</option></select>
            </label>
            <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Waitress
              <select style="height: 48px; border: 1px solid #C9CEC5; border-radius: 10px; padding: 0 10px; font-size: 16px; color: #171A16; background: #FFFFFF"><option>Dewi</option><option>Putu</option></select>
            </label>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
            <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #545C52">Adults</span>
              <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #C9CEC5; border-radius: 10px; height: 48px">
                <button type="button" aria-label="Fewer adults" onClick="{{adultDec}}" style="width: 48px; height: 46px; border: 0; background: transparent; font-size: 22px; color: #171A16">−</button>
                <span style="font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">{{adults}}</span>
                <button type="button" aria-label="More adults" onClick="{{adultInc}}" style="width: 48px; height: 46px; border: 0; background: transparent; font-size: 22px; color: #027801">+</button>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #545C52">Children</span>
              <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #C9CEC5; border-radius: 10px; height: 48px">
                <button type="button" aria-label="Fewer children" onClick="{{childDec}}" style="width: 48px; height: 46px; border: 0; background: transparent; font-size: 22px; color: #171A16">−</button>
                <span style="font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums">{{children}}</span>
                <button type="button" aria-label="More children" onClick="{{childInc}}" style="width: 48px; height: 46px; border: 0; background: transparent; font-size: 22px; color: #027801">+</button>
              </div>
            </div>
          </div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Customer (optional)
            <input placeholder="Guest name or room" style="height: 48px; box-sizing: border-box; border: 1px solid #C9CEC5; border-radius: 10px; padding: 0 14px; font-size: 16px">
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Compliment
            <select style="height: 48px; border: 1px solid #C9CEC5; border-radius: 10px; padding: 0 10px; font-size: 16px; color: #171A16; background: #FFFFFF"><option>Normal</option><option>Entertainment</option><option>Officer check</option></select>
          </label>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Market
            <select style="height: 48px; border: 1px solid #C9CEC5; border-radius: 10px; padding: 0 10px; font-size: 16px; color: #171A16; background: #FFFFFF"><option>Walk-in</option><option>In-house guest</option></select>
          </label>
          <div style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px; border-radius: 10px; background: #F3F4F1; font-size: 15px"><span style="color: #545C52">Outlet</span><b>Kayu Manis Restaurant</b></div>
          <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #545C52">Remark
            <textarea rows="2" placeholder="Anything the kitchen or cashier should know" style="box-sizing: border-box; border: 1px solid #C9CEC5; border-radius: 10px; padding: 12px 14px; font-size: 16px; resize: none"></textarea>
          </label>
        </form>
        <div style="padding: 12px 20px 20px; border-top: 1px solid #E1E4DE">
          <a href="Phone-CO.dc.html" style="height: 52px; border-radius: 10px; background: #027801; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center">Save captain order</a>
        </div>
      </section>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      cat: 'ID',
      cart: { 'ID01': 2, 'ID03': 1, 'BV01': 3 },
      notes: { 'ID01': 'No egg, extra spicy' },
      sheet: null,
      adults: 2,
      children: 0
    };
  }
  data() {
    return {
      cats: [
        { code: 'ID', name: 'Indonesian' }, { code: 'WE', name: 'Western' }, { code: 'SN', name: 'Snacks' },
        { code: 'BV', name: 'Beverage' }, { code: 'CT', name: 'Coffee & Tea' }, { code: 'DS', name: 'Dessert' }
      ],
      products: [
        { code: 'ID01', cat: 'ID', name: 'Nasi Goreng Kampung', price: 78000 },
        { code: 'ID02', cat: 'ID', name: 'Mie Goreng Jawa', price: 72000 },
        { code: 'ID03', cat: 'ID', name: 'Sate Ayam Madura', price: 85000 },
        { code: 'ID04', cat: 'ID', name: 'Soto Betawi', price: 82000 },
        { code: 'ID05', cat: 'ID', name: 'Gado-Gado', price: 65000 },
        { code: 'ID06', cat: 'ID', name: 'Ayam Bakar Taliwang', price: 98000 },
        { code: 'ID07', cat: 'ID', name: 'Ikan Bakar Jimbaran', price: 145000 },
        { code: 'ID08', cat: 'ID', name: 'Nasi Campur Bali', price: 92000 },
        { code: 'WE01', cat: 'WE', name: 'Club Sandwich', price: 95000 },
        { code: 'WE02', cat: 'WE', name: 'Beef Burger', price: 125000 },
        { code: 'WE03', cat: 'WE', name: 'Spaghetti Carbonara', price: 105000 },
        { code: 'WE04', cat: 'WE', name: 'Caesar Salad', price: 80000 },
        { code: 'WE05', cat: 'WE', name: 'Fish & Chips', price: 115000 },
        { code: 'SN01', cat: 'SN', name: 'French Fries', price: 45000 },
        { code: 'SN02', cat: 'SN', name: 'Pisang Goreng', price: 40000 },
        { code: 'SN03', cat: 'SN', name: 'Lumpia Semarang', price: 48000 },
        { code: 'SN04', cat: 'SN', name: 'Chicken Wings', price: 68000 },
        { code: 'BV01', cat: 'BV', name: 'Es Teh Manis', price: 25000 },
        { code: 'BV02', cat: 'BV', name: 'Es Jeruk', price: 30000 },
        { code: 'BV03', cat: 'BV', name: 'Jus Alpukat', price: 42000 },
        { code: 'BV04', cat: 'BV', name: 'Mineral Water', price: 20000 },
        { code: 'BV05', cat: 'BV', name: 'Coca-Cola', price: 28000 },
        { code: 'CT01', cat: 'CT', name: 'Kopi Tubruk', price: 30000 },
        { code: 'CT02', cat: 'CT', name: 'Cappuccino', price: 45000 },
        { code: 'CT03', cat: 'CT', name: 'Caffe Latte', price: 48000 },
        { code: 'CT04', cat: 'CT', name: 'Teh Tarik', price: 35000 },
        { code: 'DS01', cat: 'DS', name: 'Es Campur', price: 45000 },
        { code: 'DS02', cat: 'DS', name: 'Klepon', price: 35000 },
        { code: 'DS03', cat: 'DS', name: 'Panna Cotta', price: 55000 }
      ]
    };
  }
  fmt(n) { return Math.round(n).toLocaleString('id-ID'); }
  setQty(code, q) {
    const cart = Object.assign({}, this.state.cart);
    if (q <= 0) { delete cart[code]; } else { cart[code] = q; }
    const next = { cart: cart };
    if (Object.keys(cart).length === 0) { next.sheet = null; }
    this.setState(next);
  }
  renderVals() {
    const d = this.data();
    const s = this.state;
    const byCode = {};
    d.products.forEach((p) => { byCode[p.code] = p; });
    const catCount = {};
    Object.keys(s.cart).forEach((code) => { const c = byCode[code].cat; catCount[c] = (catCount[c] || 0) + 1; });
    const cats = d.cats.map((c) => {
      const active = c.code === s.cat;
      return {
        name: c.name,
        count: catCount[c.code] || 0,
        hasCount: !!catCount[c.code],
        style: active ? 'background: #171A16; color: #FFFFFF; border: 1px solid #171A16' : 'background: #FFFFFF; color: #171A16; border: 1px solid #C9CEC5',
        badgeStyle: active ? 'background: #FFFFFF; color: #171A16' : 'background: #027801; color: #FFFFFF',
        pick: () => this.setState({ cat: c.code })
      };
    });
    const products = d.products.filter((p) => p.cat === s.cat).map((p) => {
      const qty = s.cart[p.code] || 0;
      const words = p.name.split(' ');
      return {
        name: p.name,
        price: this.fmt(p.price),
        initials: (words[0][0] + (words[1] ? words[1][0] : '')).toUpperCase(),
        qty: qty,
        inCart: qty > 0,
        notInCart: qty === 0,
        rowStyle: qty > 0 ? 'background: #E3F1E0' : 'background: transparent',
        thumbStyle: qty > 0 ? 'background: #FFFFFF' : 'background: #E8EAE5',
        add: () => this.setQty(p.code, qty + 1)
      };
    });
    let total = 0;
    let itemCount = 0;
    const lines = Object.keys(s.cart).map((code) => {
      const p = byCode[code];
      const q = s.cart[code];
      total += p.price * q;
      itemCount += q;
      return {
        name: p.name,
        qty: q,
        amount: this.fmt(p.price * q),
        note: s.notes[code] || 'Add note',
        inc: () => this.setQty(code, q + 1),
        dec: () => this.setQty(code, q - 1)
      };
    });
    return {
      cats: cats,
      products: products,
      lines: lines,
      total: this.fmt(total),
      itemCount: itemCount,
      hasCart: itemCount > 0,
      sheetCart: s.sheet === 'cart',
      sheetForm: s.sheet === 'form',
      adults: s.adults,
      children: s.children,
      openCart: () => this.setState({ sheet: 'cart' }),
      openForm: () => this.setState({ sheet: 'form' }),
      closeSheet: () => this.setState({ sheet: null }),
      clearCart: () => this.setState({ cart: {}, sheet: null }),
      adultInc: () => this.setState({ adults: s.adults + 1 }),
      adultDec: () => this.setState({ adults: Math.max(0, s.adults - 1) }),
      childInc: () => this.setState({ children: s.children + 1 }),
      childDec: () => this.setState({ children: Math.max(0, s.children - 1) })
    };
  }
}
</script>
</body>
</html>
