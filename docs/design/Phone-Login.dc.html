        <input type="password" value="kasir123" autocomplete="current-password" style="flex: 1; border: 0; outline: none; font-size: 17px; background: transparent; min-width: 0">
        <button type="button" aria-label="Show password" style="width: 44px; height: 44px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>

        <button type="button" style="height: 44px; border: 0; border-radius: 8px; background: transparent; font-size: 16px; font-weight: 600; color: #545C52">D</button>

  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #545C52">
