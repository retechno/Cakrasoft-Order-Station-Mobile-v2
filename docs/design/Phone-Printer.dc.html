<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Printer picker</title>
<!-- design-canvas runtime omitted: open in a browser as static HTML; {{holes}} and sc-for render only in the canvas -->
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#027801}a:hover{color:#015C01}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(23, 26, 22, 0.42); font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; color: #171A16; display: flex; flex-direction: column; justify-content: flex-end">
  <section style="background: #FFFFFF; border-radius: 16px 16px 0 0; height: 640px; display: flex; flex-direction: column; box-shadow: 0 -8px 24px rgba(23, 26, 22, 0.12)">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 36px; height: 4px; border-radius: 2px; background: #C9CEC5"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 8px 8px 4px 20px">
      <div style="flex: 1; display: flex; flex-direction: column"><h2 style="margin: 0; font-size: 18px; font-weight: 800">Print captain order</h2><span style="font-size: 13px; color: #545C52">CO #10482 · 80 mm receipt</span></div>
      <a href="Phone-CO.dc.html" aria-label="Close" style="width: 48px; height: 48px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#171A16" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></a>
    </div>
    <div style="padding: 8px 20px 12px">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #F3F4F1; border-radius: 10px; padding: 4px">
        <button onClick="{{pickWifi}}" aria-pressed="{{isWifi}}" style="height: 44px; border: 0; border-radius: 8px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; {{wifiStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"></path></svg>Wi-Fi</button>
        <button onClick="{{pickBt}}" aria-pressed="{{isBt}}" style="height: 44px; border: 0; border-radius: 8px; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; {{btStyle}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 7 10 10-5 5V2l5 5L7 17"></path></svg>Bluetooth</button>
      </div>
    </div>

    <sc-if value="{{isWifi}}" hint-placeholder-val="{{true}}">
      <div style="flex: 1; display: flex; flex-direction: column; padding: 0 20px; overflow-y: auto">
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #545C52">Found on 192.168.1.x · port 9100</span>
          <button style="height: 40px; padding: 0 10px; border: 0; background: transparent; color: #027801; font-size: 14px; font-weight: 700">Scan again</button>
        </div>
        <button style="min-height: 64px; border: 1px solid #E1E4DE; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 14px; margin-bottom: 8px; text-align: left">
          <span style="width: 40px; height: 40px; border-radius: 8px; background: #E3F1E0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#027801" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"></path><rect x="7" y="14" width="10" height="7" rx="1"></rect></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">192.168.1.51</span><span style="font-size: 13px; color: #545C52">Last used · tap to print</span></span>
          <span style="height: 36px; padding: 0 14px; border-radius: 8px; background: #027801; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center">Print</span>
        </button>
        <button style="min-height: 64px; border: 1px solid #E1E4DE; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; gap: 12px; padding: 0 14px; margin-bottom: 8px; text-align: left">
          <span style="width: 40px; height: 40px; border-radius: 8px; background: #F3F4F1; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#545C52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6M7 17H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"></path><rect x="7" y="14" width="10" height="7" rx="1"></rect></svg></span>
          <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">192.168.1.64</span><span style="font-size: 13px; color: #545C52">Tap to print</span></span>
          <span style="height: 36px; padding: 0 14px; border: 1px solid #C9CEC5; border-radius: 8px; font-size: 14px; font-weight: 700; display: flex; align-items: center">Print</span>
        </button>
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 4px; font-size: 14px; color: #545C52">
          <span style="width: 16px; height: 16px; border-radius: 8px; border: 2px solid #C9CEC5; border-top-color: #027801"></span>Still scanning…
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isBt}}" hint-placeholder-val="{{false}}">
      <div style="flex: 1; display: flex; flex-direction: column; padding: 0 20px; overflow-y: auto">
        <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; margin: 4px 0 12px; border-radius: 10px; {{btBanner}}">
          <span style="width: 10px; height: 10px; border-radius: 5px; {{btDot}}"></span>
          <span style="flex: 1; font-size: 14px; font-weight: 600">{{btStatus}}</span>
        </div>
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #545C52; padding-bottom: 8px">Nearby devices</span>
        <sc-for list="{{devices}}" as="d" hint-placeholder-count="3">
          <button onClick="{{d.pick}}" style="min-height: 60px; border-radius: 10px; display: flex; align-items: center; gap: 12px; padding: 0 14px; margin-bottom: 8px; text-align: left; {{d.style}}">
            <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; font-weight: 700">{{d.name}}</span><span style="font-size: 13px; color: #545C52; font-variant-numeric: tabular-nums">{{d.addr}}</span></span>
            <sc-if value="{{d.selected}}" hint-placeholder-val="{{false}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#027801" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Selected" role="img"><path d="m5 12 5 5L20 7"></path></svg></sc-if>
          </button>
        </sc-for>
      </div>
      <div style="padding: 12px 20px 20px; border-top: 1px solid #E1E4DE; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <button onClick="{{toggleConnect}}" style="height: 52px; border: 1px solid #C9CEC5; border-radius: 10px; background: #FFFFFF; font-size: 16px; font-weight: 700">{{connectLabel}}</button>
        <button disabled="{{printDisabled}}" style="height: 52px; border: 0; border-radius: 10px; font-size: 16px; font-weight: 700; {{printStyle}}">Print</button>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'wifi', device: 'b', connected: false };
  }
  renderVals() {
    const s = this.state;
    const on = 'background: #FFFFFF; box-shadow: 0 1px 3px rgba(23, 26, 22, 0.14); font-weight: 800; color: #171A16';
    const off = 'background: transparent; font-weight: 600; color: #545C52';
    const devs = [
      { id: 'a', name: 'RPP02N', addr: '86:67:7A:21:0B:4C' },
      { id: 'b', name: 'MTP-II Bar', addr: '66:22:B3:9F:10:E7' },
      { id: 'c', name: 'Printer_5C1D', addr: 'DC:0D:30:5C:1D:02' }
    ];
    return {
      isWifi: s.tab === 'wifi',
      isBt: s.tab === 'bt',
      wifiStyle: s.tab === 'wifi' ? on : off,
      btStyle: s.tab === 'bt' ? on : off,
      pickWifi: () => this.setState({ tab: 'wifi' }),
      pickBt: () => this.setState({ tab: 'bt' }),
      devices: devs.map((d) => ({
        name: d.name,
        addr: d.addr,
        selected: s.device === d.id,
        style: s.device === d.id ? 'border: 2px solid #027801; background: #E3F1E0' : 'border: 1px solid #E1E4DE; background: #FFFFFF',
        pick: () => this.setState({ device: d.id, connected: false })
      })),
      btStatus: s.connected ? 'Connected to MTP-II Bar' : 'Not connected · select a device and connect',
      btBanner: s.connected ? 'background: #E3F1E0; color: #0B4A0A' : 'background: #F3F4F1; color: #545C52',
      btDot: s.connected ? 'background: #027801' : 'background: #C9CEC5',
      connectLabel: s.connected ? 'Disconnect' : 'Connect',
      toggleConnect: () => this.setState({ connected: !s.connected }),
      printDisabled: !s.connected,
      printStyle: s.connected ? 'background: #027801; color: #FFFFFF' : 'background: #E1E4DE; color: #6B7368'
    };
  }
}
</script>
</body>
</html>
